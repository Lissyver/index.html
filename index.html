<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sendero Meditativo</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Reproductor de Audio */
        .audio-player {
            margin-bottom: 25px;
            background: rgba(15, 23, 42, 0.5);
            padding: 10px 15px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .audio-player button {
            background: var(--accent-color);
            border: none;
            color: #0f172a;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .audio-player button:hover { opacity: 0.85; }

        /* Etapas y Temporizador */
        .timer-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #stage-title {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            font-weight: 600;
        }

        #countdown {
            font-size: 2.5rem;
            font-weight: bold;
            font-family: monospace;
            margin-bottom: 15px;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: var(--accent-color);
            transition: width 1s linear;
        }

        /* Formulario de Origen */
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button.submit-btn {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 0 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button.submit-btn:hover { opacity: 0.85; }

        /* Lista de visitantes recientes */
        .visitors-list {
            text-align: left;
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 5px;
        }

        .visitor-tag {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--accent-color);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar sutil */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sendero Interior</h1>
        <p class="subtitle">Un viaje de 8 minutos dividido en 4 etapas de profunda calma.</p>

        <!-- Reproductor de música (Audio relajante libre de derechos) -->
        <div class="audio-player">
            <span id="audio-status" style="font-size: 0.85rem;">Música ambiental: Pausada</span>
            <button id="play-music-btn" onclick="toggleAudio()">Reproducir 🎵</button>
        </div>
        <!-- Enlace de audio de muestra (puedes cambiarlo por cualquier mp3 enlazado) -->
        <audio id="bg-music" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=meditation-flute-and-water-110904.mp3"></audio>

        <!-- Bloque de Temporizador y Etapas -->
        <div class="timer-box">
            <div id="stage-title">Cargando etapa...</div>
            <div id="countdown">02:00</div>
            <div class="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
        </div>

        <!-- Registro de Origen -->
        <div class="form-group">
            <input type="text" id="origin-input" placeholder="¿De qué ciudad o país nos visitas? (ej. Buenos Aires)">
            <button class="submit-btn" onclick="registerOrigin()">Registrar</button>
        </div>

        <!-- Historial visual -->
        <div class="visitors-list" id="visitors-container">
            <div class="visitor-tag"><span>🌍 Madrid, España</span> <span style="color: var(--text-muted); font-size: 0.75rem;">Hace un momento</span></div>
            <div class="visitor-tag"><span>🌍 Ciudad de México</span> <span style="color: var(--text-muted); font-size: 0.75rem;">Hace 2 min</span></div>
        </div>
    </div>

    <script>
        // Configuración del Tiempo (Total 8 min = 4 etapas de 2 minutos / 120 segundos cada una)
        const totalStages = 4;
        const stageDuration = 120; // 120 segundos = 2 minutos por etapa
        let currentStage = 1;
        let timeLeft = stageDuration;
        let timerInterval = null;

        const stageNames = [
            "Etapa 1: La Llegada y Desconexión",
            "Etapa 2: Respiración y Presencia",
            "Etapa 3: Expansión y Claridad",
            "Etapa 4: Integración y Cierre"
        ];

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            document.getElementById("countdown").textContent = 
                String(minutes).padStart(2, '0') + ":" + String(seconds).padStart(2, '0');
            
            // Actualizar barra de progreso de la etapa actual
            let progressPercent = ((stageDuration - timeLeft) / stageDuration) * 100;
            document.getElementById("progress-bar").style.width = progressPercent + "%";
            document.getElementById("stage-title").textContent = stageNames[currentStage - 1];
        }

        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft < 0) {
                    currentStage++;
                    if (currentStage > totalStages) {
                        clearInterval(timerInterval);
                        document.getElementById("stage-title").textContent = "✨ Recorrido Finalizado";
                        document.getElementById("countdown").textContent = "00:00";
                        document.getElementById("progress-bar").style.width = "100%";
                        return;
                    }
                    timeLeft = stageDuration;
                }
                updateTimerDisplay();
            }, 1000);
        }

        // Control de Audio
        const music = document.getElementById("bg-music");
        const audioBtn = document.getElementById("play-music-btn");
        const audioStatus = document.getElementById("audio-status");
        let isPlaying = false;

        function toggleAudio() {
            if (isPlaying) {
                music.pause();
                audioBtn.textContent = "Reproducir 🎵";
                audioStatus.textContent = "Música ambiental: Pausada";
            } else {
                music.play().then(() => {
                    audioBtn.textContent = "Pausar ⏸";
                    audioStatus.textContent = "Música ambiental: Reproduciendo";
                }).catch(e => {
                    console.log("Error al reproducir audio:", e);
                });
            }
            isPlaying = !isPlaying;
        }

        // Registro de Origen de los usuarios
        function registerOrigin() {
            const input = document.getElementById("origin-input");
            const value = input.value.trim();
            if(!value) return;

            const container = document.getElementById("visitors-container");
            const newTag = document.createElement("div");
            newTag.className = "visitor-tag";
            newTag.innerHTML = `<span>🌍 ${escapeHtml(value)}</span> <span style="color: var(--text-muted); font-size: 0.75rem;">Justo ahora</span>`;
            
            container.insertBefore(newTag, container.firstChild);
            input.value = "";
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Iniciar al cargar la página
        window.onload = function() {
            startTimer();
        };
    </script>
</body>
</html>
